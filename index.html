<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BITACHON — CHANT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Noto+Sans+Hebrew:wght@500&display=swap" rel="stylesheet"/>
<style>
:root{--gold:#c9a227;--bg:#07060a;--fg:#f4efe4;--muted:#b7aa90}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07060a;color:var(--fg);font-family:"Cormorant Garamond",Georgia,serif}
button,input{font:inherit;color:inherit}
#gate,#stage{position:fixed;inset:0}
#gate{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:48px 24px 64px;text-align:center;background:linear-gradient(to top,#07060a,rgba(7,6,10,.45))}
#gate video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7;z-index:-1}
.display{font-family:Cinzel,serif;letter-spacing:.35em}
h1{font-size:clamp(40px,8vw,84px);margin:8px 0;font-weight:700}
.he{font-family:"Noto Sans Hebrew",serif;direction:rtl}
#enter{margin-top:28px;min-height:48px;padding:12px 40px;border-radius:999px;border:1px solid var(--gold);background:var(--gold);color:#120e08;letter-spacing:.28em;text-transform:uppercase;cursor:pointer}
#stage{display:none;background:#000}
#stage.on{display:block}
#stage video{width:100%;height:100%;object-fit:cover}
.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,#07060a,transparent 40%,rgba(7,6,10,.25))}
#subs{position:absolute;left:0;right:0;bottom:120px;text-align:center;padding:0 16px;text-shadow:0 2px 16px #000}
#subs p{margin:6px auto;max-width:820px;font-size:clamp(18px,2.4vw,28px)}
#subs .he{color:var(--gold);font-size:clamp(16px,2vw,24px)}
#top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:16px 18px;font-family:Cinzel,serif;font-size:12px;letter-spacing:.3em;color:var(--gold)}
#bar{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 18px;background:linear-gradient(to top,#07060a,transparent)}
input[type=range]{width:100%;accent-color:var(--gold);height:14px;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.row button{min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;border:1px solid rgba(201,162,39,.35);background:#16131c;cursor:pointer}
.ch{display:flex;justify-content:space-between;gap:4px;margin-top:4px;font-family:Cinzel,serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ch button{background:none;border:0;color:var(--muted);cursor:pointer;min-height:32px;padding:0 4px}
#card{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(7,6,10,.55);text-align:center;padding:24px}
#card.on{display:flex}
#card h2{font-family:Cinzel,serif;letter-spacing:.28em;font-size:clamp(28px,5vw,56px)}
</style>
</head>
<body>
<div id="gate">
  <video src="film/clips/saba-song.mp4" autoplay muted loop playsinline></video>
  <p class="he">בִּטָּחוֹן</p>
  <h1 class="display">BITACHON</h1>
  <p style="letter-spacing:.35em;font-style:italic;color:var(--muted)">CHANT</p>
  <p style="max-width:420px;margin-top:24px;font-size:20px">Un film. L'Emunah se lève. Saba, le roi. Le Petek. Le Chant donné au monde.</p>
  <p class="he" style="color:var(--gold)">נַ נַחְ נַחְמָ נַחְמָן מֵאוּמַן</p>
  <button id="enter" type="button">ENTRER — 20:00</button>
  <p style="color:var(--muted);margin-top:16px">Barre de lecture · Flèches ±10s · Espace pause</p>
</div>
<div id="stage">
  <video id="vid" playsinline></video>
  <div class="veil"></div>
  <div id="card"><div><p class="he" id="cardHe"></p><h2 id="cardTitle"></h2></div></div>
  <div id="subs"><p class="he" id="he"></p><p id="cap"></p></div>
  <div id="top"><span>BITACHON · <span id="chap"></span></span><span id="tc"></span></div>
  <div id="bar">
    <input id="seek" type="range" min="0" max="1200" step="0.25" value="0"/>
    <div class="ch" id="chRow"></div>
    <div class="row">
      <button type="button" id="back">−10s</button>
      <button type="button" id="play">Pause</button>
      <button type="button" id="fwd">+10s</button>
      <span id="lang"></span>
    </div>
  </div>
</div>
<script>
const DATA = {"total": 1200, "shots": [{"id": "p1", "src": "film/clips/u20-letters.mp4", "duration": 12, "act": "open", "hebrew": null, "title": null, "card": false, "caption": "Nous croyions que le temps était une ligne. Il ne l'était pas.", "captionEn": "We believed time was a line. It was not."}, {"id": "p2", "src": "film/clips/u01-alley.mp4", "duration": 12, "act": "open", "hebrew": null, "title": null, "card": false, "caption": "Dans les ruelles mouillées, des visiteurs venaient d'avant et d'après. Ils cherchaient un Nom.", "captionEn": "In the wet alleys, visitors came from before and after. They were looking for a Name."}, {"id": "k1", "src": "film/clips/u03-cabinet.mp4", "duration": 30, "act": "petek", "hebrew": "הפתק", "title": null, "card": false, "caption": "Tibériade, 1922. Un élève brisé ouvrit une armoire. Un papier tomba.", "captionEn": "Tiberias, 1922. A broken student opened a cabinet. A paper fell."}, {"id": "k2", "src": "film/clips/u04-parchment.mp4", "duration": 30, "act": "petek", "hebrew": "מאד היה קשה לי לרדת אליך", "title": null, "card": false, "caption": "« Très dur fut-il pour moi de descendre vers toi, mon précieux élève. »", "captionEn": "“Very hard it was for me to descend to you, my precious student.”"}, {"id": "k3", "src": "film/clips/saba-close.mp4", "duration": 24, "act": "petek", "hebrew": "האש שלי תוקד עד ביאת המשיח", "title": null, "card": false, "caption": "« Mon feu brûlera jusqu'à la venue du Mashiach. Sois fort et courageux. »", "captionEn": "“My fire will burn until Messiah comes. Be strong and brave.”"}, {"id": "k4", "src": "film/clips/saba-song.mp4", "duration": 30, "act": "petek", "hebrew": "נַ נַחְ נַחְמָ נַחְמָן מֵאוּמַן", "title": null, "card": false, "caption": "Na Nach Nachma Nachman Me'Uman. Le Nom. Le Chant. La clé.", "captionEn": "Na Nach Nachma Nachman Me'Uman. The Name. The Song. The key."}, {"id": "k5", "src": "film/clips/u09-saba-profile.mp4", "duration": 30, "act": "petek", "hebrew": null, "title": null, "card": false, "caption": "Il garda le secret soixante-sept ans. Puis il le donna au monde.", "captionEn": "He kept the secret sixty-seven years. Then he gave it to the world."}, {"id": "k6", "src": "film/clips/u10-saba-eyes.mp4", "duration": 24, "act": "petek", "hebrew": null, "title": null, "card": false, "caption": "« Le monde entier, et tout le gouvernement, ne savent pas qui je suis. »", "captionEn": "“The whole world, and the whole government, do not know who I am.”"}, {"id": "k7", "src": "film/clips/petek-macro.mp4", "duration": 30, "act": "petek", "hebrew": null, "title": null, "card": false, "caption": "Le Petek n'était pas un souvenir. C'était une porte. Cette nuit-là, la clé tourna.", "captionEn": "The Petek was not a souvenir. It was a door. That night, the key turned."}, {"id": "s1", "src": "film/clips/u13-data.mp4", "duration": 30, "act": "sleep", "hebrew": null, "title": null, "card": false, "caption": "Pendant ce temps, le monde dormait encore. Les machines pensaient à la place des hommes.", "captionEn": "Meanwhile the world still slept. Machines thought in the place of men."}, {"id": "s2", "src": "film/clips/u14-news.mp4", "duration": 24, "act": "sleep", "hebrew": null, "title": null, "card": false, "caption": "Les écrans parlaient sans relâche. Personne n'écoutait.", "captionEn": "The screens never stopped talking. No one was listening."}, {"id": "s3", "src": "film/clips/u06-war.mp4", "duration": 30, "act": "sleep", "hebrew": null, "title": null, "card": false, "caption": "Les empires se surveillaient. Ils n'entendaient rien.", "captionEn": "Empires watched one another. They heard nothing."}, {"id": "s4", "src": "film/clips/u02-aerial.mp4", "duration": 30, "act": "sleep", "hebrew": null, "title": null, "card": false, "caption": "Au-dessus de Jérusalem, une maille d'or commença à se tisser.", "captionEn": "Above Jerusalem, a gold lattice began to stitch itself."}, {"id": "s5", "src": "film/clips/u21-mea.mp4", "duration": 30, "act": "sleep", "hebrew": null, "title": null, "card": false, "caption": "Ceux qui venaient d'ailleurs reconnurent le Chant avant nous.", "captionEn": "Those who came from elsewhere recognized the Song before we did."}, {"id": "s6", "src": "film/clips/datacenter.mp4", "duration": 24, "act": "sleep", "hebrew": "אֱמוּנָה", "title": null, "card": false, "caption": "Ce n'était pas une intelligence artificielle. C'était l'Emunah — la foi — qui se levait.", "captionEn": "It was not artificial intelligence. It was Emunah — faith — rising."}, {"id": "f1", "src": "film/clips/u28-saba-roof.mp4", "duration": 30, "act": "field", "hebrew": "השיר", "title": "LE CHANT", "card": true, "caption": "Saba leva les bras. Le Chant sortit de lui comme un fleuve.", "captionEn": "Saba raised his arms. The Song came out of him like a river."}, {"id": "f2", "src": "film/clips/saba-liberator.mp4", "duration": 24, "act": "field", "hebrew": "רַבֵּנוּ מֶלֶךְ", "title": null, "card": false, "caption": "Le Libérateur n'ouvrit pas une matrice d'hommes. Il ouvrit la création.", "captionEn": "The Liberator did not open a matrix of men. He opened creation."}, {"id": "f3", "src": "film/clips/u11-saba-away.mp4", "duration": 30, "act": "field", "hebrew": null, "title": null, "card": false, "caption": "Les lettres d'or tombèrent — non comme un code : comme une Torah vivante.", "captionEn": "Gold letters fell — not as code: as living Torah."}, {"id": "f4", "src": "film/clips/u18-hands.mp4", "duration": 24, "act": "field", "hebrew": null, "title": null, "card": false, "caption": "Le Chant n'obéit qu'à l'intention droite. Le mal n'a plus de nourriture : il se dissipe.", "captionEn": "The Song obeys only right intention. Evil has no food left: it dissipates."}, {"id": "f5", "src": "film/clips/u05-lookup.mp4", "duration": 30, "act": "field", "hebrew": "אֱמוּנָה", "title": null, "card": false, "caption": "C'est ainsi que le monde commença à basculer vers l'Emunah — la foi en Saba, le roi.", "captionEn": "This is how the world began to turn toward Emunah — faith in Saba, the king."}, {"id": "f6", "src": "film/clips/u16-choir.mp4", "duration": 30, "act": "field", "hebrew": null, "title": null, "card": false, "caption": "Le monde entier commença à entendre le Nom. Un seul souffle. Pas encore compris.", "captionEn": "The whole world began to hear the Name. One breath. Not yet understood."}, {"id": "n1", "src": "film/clips/newsroom.mp4", "duration": 24, "act": "nations", "hebrew": null, "title": null, "card": false, "caption": "Alors les nations crièrent au complot. Hologramme. Blue Beam. Arme secrète.", "captionEn": "Then the nations cried conspiracy. Hologram. Blue Beam. Secret weapon."}, {"id": "n2", "src": "film/clips/warroom.mp4", "duration": 24, "act": "nations", "hebrew": null, "title": null, "card": false, "caption": "« C'est la Chine. » « C'est Washington. » Chacun espionnait l'autre.", "captionEn": "“It's China.” “It's Washington.” Each spied on the other."}, {"id": "n3", "src": "film/clips/u15-avenue.mp4", "duration": 30, "act": "nations", "hebrew": null, "title": null, "card": false, "caption": "Personne n'avait lancé le projet. Le Chant n'appartient à aucun État.", "captionEn": "No one had launched the project. The Song belongs to no state."}, {"id": "n4", "src": "film/clips/u12-van.mp4", "duration": 30, "act": "nations", "hebrew": null, "title": null, "card": false, "caption": "Et depuis des années, le Nom était déjà peint sur les camions, dans les rues.", "captionEn": "And for years the Name had already been painted on the vans, in the streets."}, {"id": "n5", "src": "film/clips/ailab.mp4", "duration": 24, "act": "nations", "hebrew": null, "title": null, "card": false, "caption": "On lança toutes les machines pour comprendre. Elles trouvèrent une seule corrélation.", "captionEn": "They launched every machine to understand. They found one correlation."}, {"id": "g1", "src": "film/clips/anchor.mp4", "duration": 24, "act": "plagues", "hebrew": null, "title": null, "card": false, "caption": "La parole contre Hachem, contre Israël, contre Breslev, contre Saba. Le Chant répondait.", "captionEn": "Speech against Hashem, Israel, Breslov, Saba. The Song answered."}, {"id": "g2", "src": "film/clips/u17-knesset.mp4", "duration": 24, "act": "plagues", "hebrew": null, "title": null, "card": false, "caption": "Comme l'Égypte, pour cette génération. Pas de sang. Une plaie de silence.", "captionEn": "Like Egypt, for this generation. No blood. A plague of silence."}, {"id": "g3", "src": "film/clips/parliament.mp4", "duration": 24, "act": "plagues", "hebrew": null, "title": null, "card": false, "caption": "Même dans le pays, ceux qui parlèrent contre le peuple d'Israël s'éteignirent. Le monde le vit.", "captionEn": "Even in the land, those who spoke against the people of Israel went dark. The world saw it."}, {"id": "g4", "src": "film/clips/empty-streets.mp4", "duration": 24, "act": "plagues", "hebrew": null, "title": null, "card": false, "caption": "Ce n'était pas un assassinat. C'était le Din — pour qu'on comprenne.", "captionEn": "It was not assassination. It was Din — so they would understand."}, {"id": "g5", "src": "film/clips/saba-walk.mp4", "duration": 24, "act": "plagues", "hebrew": "סַבָּא הוּא הַמֶּלֶךְ", "title": null, "card": false, "caption": "Ceux qui restaient à Jérusalem, ceux qui tenaient Saba pour roi — le Chant les garda.", "captionEn": "Those who remained in Jerusalem, who held Saba as king — the Song kept them."}, {"id": "t1", "src": "film/clips/u07-tombs.mp4", "duration": 30, "act": "graves", "hebrew": null, "title": null, "card": false, "caption": "Alors, sur le mont des Oliviers, les tombes s'ouvrirent — non comme une horreur : comme une aube.", "captionEn": "Then on the Mount of Olives the tombs opened — not as horror: as dawn."}, {"id": "t2", "src": "film/clips/olives-dawn.mp4", "duration": 30, "act": "graves", "hebrew": "תְּחִיַּת הַמֵּתִים", "title": null, "card": false, "caption": "Les tzaddikim se tinrent debout. Saba parmi eux.", "captionEn": "The tzaddikim stood. Saba among them."}, {"id": "t3", "src": "film/clips/saba-olives.mp4", "duration": 30, "act": "graves", "hebrew": null, "title": null, "card": false, "caption": "Le Libérateur au milieu des justes. Le Chant donnait domination — seulement à l'intention droite.", "captionEn": "The Liberator among the righteous. The Song gave dominion — only to right intention."}, {"id": "t4", "src": "film/clips/triad.mp4", "duration": 30, "act": "graves", "hebrew": null, "title": null, "card": false, "caption": "Trois trônes d'améthyste s'élevèrent. Les justes prirent place.", "captionEn": "Three amethyst thrones rose. The righteous took their place."}, {"id": "t5", "src": "film/clips/u08-kotel-dawn.mp4", "duration": 30, "act": "graves", "hebrew": "וְהָיָה ה' לְמֶלֶךְ עַל כָּל הָאָרֶץ", "title": null, "card": false, "caption": "Toutes les nations se tinrent au Mur. Sans idole. Devant l'Unique.", "captionEn": "All nations stood at the Wall. No idol. Before the One."}, {"id": "c1", "src": "film/clips/u26-kotel-fill.mp4", "duration": 30, "act": "song", "hebrew": "אֱמוּנָה", "title": null, "card": false, "caption": "Emunah en Saba, le roi. Tout le monde accepta que Rabbenou soit le roi.", "captionEn": "Emunah in Saba, the king. Everyone accepted that Rabbeinu is the king."}, {"id": "c2", "src": "film/clips/saba-kotel.mp4", "duration": 24, "act": "song", "hebrew": null, "title": null, "card": false, "caption": "Il donna le Shir HaShirim à l'humanité entière. Le Chant de cette génération.", "captionEn": "He gave Shir HaShirim to all humanity. The Song of this generation."}, {"id": "c3", "src": "film/clips/choir.mp4", "duration": 30, "act": "song", "hebrew": null, "title": null, "card": false, "caption": "Le monde entier chanta le même Nom. Un seul souffle.", "captionEn": "The whole world sang the same Name. One breath."}, {"id": "c4", "src": "film/clips/nanach-van.mp4", "duration": 24, "act": "song", "hebrew": null, "title": null, "card": false, "caption": "Ce qui était dans les rues était maintenant dans le ciel.", "captionEn": "What was in the streets was now in the sky."}, {"id": "c5", "src": "film/clips/hands.mp4", "duration": 24, "act": "song", "hebrew": null, "title": null, "card": false, "caption": "Création. Intention. Unité. Le mal n'avait plus de lieu.", "captionEn": "Creation. Intention. Unity. Evil had no place left."}, {"id": "c6", "src": "film/clips/travelers.mp4", "duration": 24, "act": "song", "hebrew": "אֵין עוֹד מִלְּבַדּוֹ", "title": null, "card": false, "caption": "Il n'y a rien d'autre que Lui.", "captionEn": "There is nothing besides Him."}, {"id": "c7", "src": "film/clips/kotel-crowd.mp4", "duration": 30, "act": "song", "hebrew": "נַ נַחְ נַחְמָ נַחְמָן מֵאוּמַן", "title": null, "card": false, "caption": "Na Nach Nachma Nachman Me'Uman", "captionEn": ""}, {"id": "c8", "src": "film/clips/jerusalem-aerial.mp4", "duration": 54, "act": "song", "hebrew": "בִּטָּחוֹן", "title": "BITACHON", "card": true, "caption": "CHANT · Emunah · Un film", "captionEn": "CHANT · Emunah · A film"}]};
const SHOTS = DATA.shots;
const CH = [
  ["open","Prologue"],["sleep","Le monde endormi"],["petek","Le Petek"],["field","Le Chant"],
  ["nations","Nations"],["plagues","Plaies"],["graves","Tombes"],["song","Emunah"]
];
const starts = [0];
SHOTS.forEach(s => starts.push(starts[starts.length-1]+s.duration));
const TOTAL = starts[starts.length-1];
let i=0, playing=false, lang="fr";
const vid=document.getElementById("vid");
const seek=document.getElementById("seek");
seek.max=TOTAL;
function tc(t){t=Math.max(0,Math.floor(t)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function shot(){return SHOTS[i]}
function elapsed(){
  const s=shot();
  if(!vid.duration) return 0;
  return (vid.currentTime/vid.duration)*s.duration;
}
function load(idx, offset){
  i=Math.max(0,Math.min(idx,SHOTS.length-1));
  const s=shot();
  vid.src=s.src;
  document.getElementById("cap").textContent = lang==="en" ? (s.captionEn||s.caption) : s.caption;
  document.getElementById("he").textContent = s.hebrew||"";
  document.getElementById("chap").textContent = (CH.find(c=>c[0]===s.act)||["",""])[1];
  const card=document.getElementById("card");
  if(s.card && (s.title||s.hebrew)){
    card.classList.add("on");
    document.getElementById("cardHe").textContent=s.hebrew||"";
    document.getElementById("cardTitle").textContent=s.title||"";
  } else card.classList.remove("on");
  vid.onloadedmetadata=()=>{
    const rate=Math.min(1, Math.max(0.42, vid.duration/s.duration));
    vid.playbackRate=rate;
    if(offset){ vid.currentTime = (offset/s.duration)*vid.duration; }
    if(playing) vid.play().catch(()=>{});
  };
}
function atTime(t){
  for(let n=0;n<SHOTS.length;n++){
    if(t < starts[n+1] || n===SHOTS.length-1) return {i:n, off: Math.max(0,t-starts[n])};
  }
  return {i:0,off:0};
}
function seekTo(t){
  t=Math.min(Math.max(t,0), TOTAL-0.05);
  const f=atTime(t);
  load(f.i, f.off);
}
vid.addEventListener("timeupdate", ()=>{
  const t=starts[i]+elapsed();
  seek.value=t;
  document.getElementById("tc").textContent=tc(t)+" / "+tc(TOTAL);
});
vid.addEventListener("ended", ()=>{
  if(i<SHOTS.length-1) load(i+1,0);
  else { playing=false; document.getElementById("play").textContent="Lecture"; }
});
document.getElementById("enter").onclick=()=>{
  document.getElementById("gate").style.display="none";
  document.getElementById("stage").classList.add("on");
  playing=true;
  load(0,0);
};
document.getElementById("play").onclick=()=>{
  playing=!playing;
  if(playing) vid.play(); else vid.pause();
  document.getElementById("play").textContent=playing?"Pause":"Lecture";
};
document.getElementById("back").onclick=()=>seekTo(+seek.value-10);
document.getElementById("fwd").onclick=()=>seekTo(+seek.value+10);
seek.oninput=()=>seekTo(+seek.value);
document.getElementById("chRow").innerHTML=CH.map(([id,lab])=>'<button type="button" data-act="'+id+'">'+lab+'</button>').join("");
document.getElementById("chRow").onclick=e=>{
  const b=e.target.closest("button"); if(!b) return;
  const idx=SHOTS.findIndex(s=>s.act===b.dataset.act);
  if(idx>=0){ playing=true; load(idx,0); document.getElementById("play").textContent="Pause"; }
};
window.addEventListener("keydown", e=>{
  if(e.code==="Space"){ e.preventDefault(); document.getElementById("play").click(); }
  if(e.code==="ArrowRight") seekTo(+seek.value+10);
  if(e.code==="ArrowLeft") seekTo(+seek.value-10);
});
</script>
</body>
</html>
